<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for assets/og.png (the link preview image). Render at 1200x630. -->
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f1f0ed; font-family: 'Inter Tight', sans-serif; color: #111112; }
  .orb { position: absolute; width: 700px; height: 700px; right: -160px; top: -40px; border-radius: 50%; filter: blur(40px); opacity: .7;
    background: radial-gradient(circle at 35% 30%, #fff 0 18%, transparent 45%), conic-gradient(from 40deg, #cfcfd3, #8d8d93, #f4f4f6, #a7a7ad, #e6e6e9, #77777d, #cfcfd3); }
  .wrap { position: absolute; left: 80px; top: 90px; }
  .who { display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 600; }
  .who img { width: 72px; height: 72px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px #fff, 0 10px 30px rgba(0,0,0,.12); }
  .who span { color: #66656b; font-weight: 500; }
  h1 { font-size: 112px; line-height: .95; letter-spacing: -0.055em; font-weight: 600; margin: 50px 0 0; }
  h1 em { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.02em; }
  .pill { display: inline-block; margin-top: 40px; padding: 16px 28px; border-radius: 999px; color: #fff; font-size: 26px; font-weight: 600;
    background: linear-gradient(180deg, #3a3a3e, #0b0b0c); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
</style></head>
<body>
  <div class="orb"></div>
  <div class="wrap">
    <div class="who"><img src="../assets/avatar.jpg" alt=""> Wheat <span>@wheatsellz0</span></div>
    <h1>Learn AI the<br><em>simple</em> way.</h1>
    <div class="pill">Free AI &amp; CS guides with animated explainers</div>
  </div>
</body></html>
